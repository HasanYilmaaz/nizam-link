<style>
  :root {
    --ink: #14202e;
    --ink-2: #1c2b3c;
    --paper: #f7f4ee;
    --brass: #c9a96a;
    --brass-soft: rgba(201, 169, 106, .16);
    --text: #eef1f5;
    --muted: #a9b3c1;
    --card: rgba(255, 255, 255, .06);
    --card-line: rgba(255, 255, 255, .10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(120% 60% at 50% -10%, #2a3d55 0%, transparent 60%),
      linear-gradient(180deg, var(--ink-2) 0%, var(--ink) 100%);
    background-color: var(--ink);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: max(40px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; }

  .crest {
    width: 92px; height: 92px; border-radius: 50%;
    display: grid; place-items: center;
    border: 1px solid var(--brass);
    box-shadow: 0 0 0 6px var(--brass-soft);
    background: radial-gradient(circle at 50% 35%, #233449, var(--ink));
    margin-top: 8px;
  }
  .crest span { font-family: "Cormorant Garamond", Georgia, serif; font-size: 48px; font-weight: 600; color: var(--brass); line-height: 1; transform: translateY(-2px); }

  h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600; font-size: 34px; letter-spacing: .01em;
    margin: 22px 0 4px; text-align: center;
  }
  .tag { margin: 0; color: var(--brass); font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; }
  .rule { width: 48px; height: 1px; background: var(--brass); opacity: .6; margin: 20px 0 8px; }
  .addr { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; text-align: center; }

  .links { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
  .btn {
    display: flex; align-items: center; gap: 14px;
    width: 100%; min-height: 68px; padding: 12px 18px;
    border-radius: 16px;
    background: var(--card);
    border: 1px solid var(--card-line);
    color: var(--text); text-decoration: none;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { background: rgba(255, 255, 255, .09); border-color: rgba(201, 169, 106, .5); }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
  .icon { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
  .icon svg { width: 24px; height: 24px; }
  .label { flex: 1; min-width: 0; }
  .label strong { display: block; font-size: 16px; font-weight: 600; }
  .label small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .chev { flex: none; width: 18px; height: 18px; color: var(--muted); }

  .maps .icon { background: #e8f0fe; color: #1a73e8; }
  .wa .icon { background: #25d366; color: #fff; }
  .review .icon { background: var(--brass); color: var(--ink); }

  .btn.primary { background: var(--paper); border-color: var(--paper); color: var(--ink); }
  .btn.primary .label small, .btn.primary .chev { color: #5b6574; }
  .btn.primary:hover { background: #fff; }

  footer { margin-top: auto; padding-top: 40px; color: var(--muted); font-size: 12px; text-align: center; }
  footer a { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
